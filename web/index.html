<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Smart Smoker Push Experiment</title>
</head>
<body>
  <h1 data-i18n="app.title"></h1>
  <p data-i18n="app.instructions"></p>
  <label for="language" data-i18n="app.language"></label>
  <select id="language"></select>
  <p><label for="key" data-i18n="app.key"></label><br><input id="key" size="40" autocomplete="off" spellcheck="false"></p>
  <button id="subscribe" disabled data-i18n="app.subscribe"></button>
  <button id="export" disabled data-i18n="app.export"></button>
  <button id="unsubscribe" disabled data-i18n="app.unsubscribe"></button>
  <p role="status" id="status"></p>
  <label for="output" data-i18n="app.output"></label><br>
  <textarea id="output" rows="12" cols="40" readonly spellcheck="false"></textarea>
  <script src="i18n.js"></script>
  <script src="catalogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
